<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>For My Bujji Konda ❤️</title>


<link rel="stylesheet" href="style.css">



<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">


</head>



<body>


<audio id="music" loop preload="auto">

    <source src="our-song.mp3" type="audio/mpeg">

</audio>





<!-- =====================
     PAGE 1
===================== -->


<section id="landing" class="page active">


<div class="envelope-box">


<img src="images/envelope.png" id="envelope">



<p>

♡ Open When You Miss Me ♡

</p>



</div>


</section>









<!-- =====================
     PAGE 2
===================== -->


<section id="question" class="page">


<div class="question-box">


<h1>

To the prettiest girl in my world ❤️

</h1>



<p>

Do you miss me too?

</p>




<div class="buttons">



<button id="yes-btn">

💖 I Miss You Too

</button>



<button id="no-btn">

💔 I Don't Miss You

</button>



</div>


</div>


</section>









<!-- =====================
     PAGE 3
===================== -->


<section id="letter" class="page">


<div class="collage-bg"></div>




<div class="letter-card">



<h1>

Na Cutu Pandu ❤️

</h1>



<div id="letter-text"></div>



</div>



</section>







<script src="script.js"></script>


</body>


</html>
